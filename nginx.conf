server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Match the backend request bound (EVIDENCE_MAX_REQUEST_SIZE, 20 MB) so an oversize upload is
    # answered by the backend with its structured 413 instead of an nginx error page. The per-file
    # limit (EVIDENCE_MAX_FILE_SIZE, 10 MB) is enforced by the backend.
    client_max_body_size 20M;

    # Resolve the backend service through Docker DNS at request time. The backend is deployed
    # independently and its container IP can change after a replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy /api/ to backend container
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

    }
    # Cache static assets
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
