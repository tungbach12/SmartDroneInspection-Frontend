name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy frontend independently (VPS2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          tags: tag:ci
          ping: 100.120.66.114

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 100.120.66.114 >> ~/.ssh/known_hosts

      - name: Deploy frontend container
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ubuntu@100.120.66.114 '
            set -e
            command -v flock >/dev/null 2>&1 || { echo "flock(1) is required to serialise deploys"; exit 1; }
            exec 9>/tmp/sdi-deploy.lock
            flock -w 900 9 || { echo "Timed out waiting for the deploy lock"; exit 1; }
            echo "Acquired deploy lock"
            cd ~/repos/frontend
            git fetch --depth 1 origin main
            git reset --hard origin/main
            # Build first so an image/build error leaves the currently running web container intact.
            WEB_PORT=18080 DOCKER_NETWORK_NAME=backend_smartdroneinspection-network docker compose build
            # The previous frontend was an orphan owned by backend Compose and has this fixed name.
            # Remove only that frontend after the replacement image built successfully.
            docker rm -f smartdroneinspection-web 2>/dev/null || true
            WEB_PORT=18080 DOCKER_NETWORK_NAME=backend_smartdroneinspection-network \
              docker compose up -d --no-build --remove-orphans
            healthy=false
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null -w "web HTTP %{http_code}\n" http://127.0.0.1:18080/; then
                healthy=true
                break
              fi
              sleep 2
            done
            test "$healthy" = true
            echo "Frontend deployed at $(date -u +%FT%TZ)"
          '
