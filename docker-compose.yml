services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartdroneinspection-web:latest
    container_name: smartdroneinspection-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - smartdroneinspection-network

networks:
  smartdroneinspection-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-backend_smartdroneinspection-network}
