<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .ribbon-track { animation: ribbon-dash 3s linear infinite; }
    .ribbon-dot { animation: ribbon-dot 3s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
    .ribbon-dot-2 { animation-delay: 1s; }
    .ribbon-dot-3 { animation-delay: 2s; }
    @keyframes ribbon-dash { to { stroke-dashoffset: -48; } }
    @keyframes ribbon-dot {
      0%, 100% { transform: scale(0.5); opacity: 0.35; }
      25% { transform: scale(1.15); opacity: 1; }
      60% { transform: scale(0.7); opacity: 0.6; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ribbon-track { animation: none; }
      .ribbon-dot { animation: none; transform: scale(0.8); opacity: 0.8; }
    }
  </style>
  <path class="ribbon-track" d="M6 32c6-9 11 4 17-4s10 5 19-6" fill="none" stroke="#7B75F5" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 11" />
  <circle class="ribbon-dot" cx="9" cy="30" r="2.6" fill="#7B75F5" />
  <circle class="ribbon-dot ribbon-dot-2" cx="24" cy="27" r="2.6" fill="#7B75F5" />
  <circle class="ribbon-dot ribbon-dot-3" cx="40" cy="21" r="2.6" fill="#7B75F5" />
</svg>
